name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "bug"
      - "bugfix"
      - "fix"
  - title: "📝 Documentation"
    labels:
      - "documentation"
      - "docs"
  - title: "🧰 Maintenance"
    labels:
      - "chore"
      - "refactor"
      - "ci"
      - "dependencies"
      - "frontend"
      - "rust"

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&`#@'

include-pre-releases: false

version-resolver:
  major:
    labels:
      - "major"
  minor:
    labels:
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "bug"
      - "bugfix"
      - "fix"
      - "chore"
      - "refactor"
      - "ci"
      - "documentation"
      - "docs"
      - "dependencies"
      - "frontend"
      - "rust"
  default: patch

exclude-labels:
  - "skip-changelog"

# Auto-label PRs so categories and version resolution work without manual
# labeling: conventional-commit titles (feat:, fix:, docs:, chore:) plus
# file-based labels for CI, Rust, docs and dependency changes.
autolabeler:
  - label: "feature"
    title: "/^feat(\\(.*\\))?:/i"
  - label: "bug"
    title: "/^fix(\\(.*\\))?:/i"
  - label: "documentation"
    title: "/^docs?(\\(.*\\))?:/i"
  - label: "chore"
    title: "/^(chore|refactor|build|ci|test)(\\(.*\\))?:/i"
  - label: "ci"
    files:
      - ".github/**"
  - label: "rust"
    files:
      - "src-tauri/**"
  - label: "documentation"
    files:
      - "*.md"
      - "docs/**"
  - label: "dependencies"
    files:
      - "package.json"
      - "bun.lock"

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION